<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      layout:decorate="~{main}">
  
  <head>
    <title>Checkout</title>
  </head>
  <body>
     <main layout:fragment="content">
        <div class="container">
            <div class="login-form">
        <!-- Update the form action to point to your backend -->
        <form th:action="@{/process-checkout}" method="post" th:object="${checkoutForm}">
            <!-- CSRF token for Spring Security -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label for="name">Name</label>
            <input type="text" placeholder="Enter Name" th:field="*{name}" required />

            <label for="email">Email</label>
            <input type="email" placeholder="Enter Email" th:field="*{email}" required />

            <h1>Shipping Information</h1>

            <label for="address">Address</label>
            <input type="text" placeholder="Enter Address" th:field="*{address}" required />

            <label for="state">State</label>
            <input type="text" placeholder="Enter State" th:field="*{state}" required />

            <label for="city">City</label>
            <input type="text" placeholder="Enter City" th:field="*{city}" required />

            <label for="zip">Zip Code</label>
            <input type="text" placeholder="Enter Zip Code" th:field="*{zip}" required />

            <div class="buttons">
                <button type="button" class="cancelbtn">Cancel</button>
                <button type="submit" class="signupbtn">Make Payment</button>
            </div>
        </form>
    </div>
</div>

      </main>
</body>
</html>
