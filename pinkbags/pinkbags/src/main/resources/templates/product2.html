<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      layout:decorate="~{main}">
  
  <head>
    <title>Products</title>
  </head>
  <body>
     <main layout:fragment="content">
     
    <!-- All Products -->
     
    <section class="section all-products" id="products">
      <div class="top container">
        <h1>All Products</h1>
          <div id="filters">
            <select id="categoryFilter">
              <option value="all">All</option>
              <option value="purse">Purses</option>
              <option value="handbag">Handbags</option>
              <option value="backpack">Backpacks</option>
            </select>

            <select id="priceFilter">
              <option value="all">All Prices</option>
              <option value="low">Under $900</option>
              <option value="mid">$900 - $1000</option>
              <option value="high">Above $1000</option>
            </select>
          </div>
      </div>
      <div class="product-center">
        <div class="product-item" th:each="product : ${products}">
          <div class="overlay">
            <!-- Dynamic product detail URL -->
            <a th:href="@{/product/{id}(id=${product.id})}" class="product-thumb">
              <!-- Dynamic product image -->
              <img th:src="${product.image}" alt="Product Image">
            </a>
            <span class="discount" th:if="${product.discount}" th:text="${product.discount + '%'}"></span>
          </div>
          <div class="product-info">
            <!-- Dynamic category name -->
            <span th:text="${#strings.toUpperCase(product.category.name)}">CATEGORY</span>
            <!-- Dynamic product name -->
            <a th:href="@{/product/{id}(id=${product.id})}" th:text="${product.name}">Product Name</a>
            <!-- Dynamic product price -->
            <h4 th:text="'$' + ${product.price}">$0.00</h4>
          </div>
        <ul class="icons">
    <!-- If logged in, show Add to Cart icon -->
    <li sec:authorize="isAuthenticated()">
        <i th:attr="data-product=${product.id},data-action='add'"
           class="bx bx-cart update_cart"
           title="Add to Cart"></i>
    </li>

    <!-- If not logged in, link to login page -->
    <li sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}">
            <i class="bx bx-cart" title="Login to Add"></i>
        </a>
    </li>
</ul>
        </div>
      </div>

      <!-- Notification message container -->
<div id="cart-message" class="cart-message"></div>

    </section>   
    
    <!-- Pagination -->
    <section class="pagination">
      <div class="container">   
        <a th:href="@{/product}"><span><i class="bx bx-left-arrow-alt"></i></span></a> 
        <a th:href="@{/product}"><span>1</span></a>
        <a th:href="@{/product2}"><span>2</span></a>
        
      </div>
    </section>

    </main>


    <div layout:fragment="scripts">
     <script>
      document.addEventListener('DOMContentLoaded', function () {
    // Select all add-to-cart icons
    const updateCartIcons = document.querySelectorAll('.update_cart');
    const cartMessage = document.getElementById('cart-message');
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');


    updateCartIcons.forEach(icon => {
        icon.addEventListener('click', function () {
            const productId = this.getAttribute('data-product');
            const action = this.getAttribute('data-action');

            // Send AJAX request to backend
            fetch('/update-item', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken   // <-- dynamic header name
                },
                body: JSON.stringify({ productId: productId, action: action })
            })
            .then(response => response.text())
            .then(data => {
                // Show notification
                cartMessage.textContent = "Product added to your cart!";
                cartMessage.classList.add('show');

                // Hide after 2 seconds
                setTimeout(() => {
                    cartMessage.classList.remove('show');
                }, 2000);
            })
            .catch(err => console.error(err));
        });
    });
});
</script>
<script>
  $(document).ready(function () {
    function filterProducts() {
      let selectedCategory = $("#categoryFilter").val().toLowerCase();
      let selectedPrice = $("#priceFilter").val();

      $(".product-item").each(function () {
        let category = $(this).find(".product-info span").text().toLowerCase();
        let priceText = $(this).find(".product-info h4").text().replace('$', '').trim();
        let price = parseFloat(priceText);
        let show = true;

        // Category filter
        if (selectedCategory !== "all" && !category.includes(selectedCategory)) {
          show = false;
        }

        // Price filter
        if (selectedPrice === "low" && price >= 900) show = false;
        if (selectedPrice === "mid" && (price < 900 || price > 1000)) show = false;
        if (selectedPrice === "high" && price <= 1000) show = false;

        // Show/hide product
        if (show) {
          $(this).show();
        } else {
          $(this).hide();
        }
      });
    }

    // Run filter when dropdown changes
    $("#categoryFilter, #priceFilter").on("change", filterProducts);
  });
</script>

    </div>
  </body>
</html>
